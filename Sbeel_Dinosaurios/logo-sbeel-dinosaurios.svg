<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-labelledby="title desc">
  <title id="title">SBEEL Dinosaurios</title>
  <desc id="desc">Logo estilizado de SBEEL Dinosaurios para la barra superior.</desc>
  <defs>
