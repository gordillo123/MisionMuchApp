<!DOCTYPE html>
<html lang="es" data-orientation="portrait">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sbeel Dinosaurios - Rompecabezas</title>
    <script src="../assets/navigation-guard.js"></script>
    <script src="../assets/role-access.js"></script>
    <script>
        window.MuchRoleAccess?.redirectIfInternalUserOnPlayerPage({ basePath: '../' });
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../assets/station-completion.css">
    <!-- Google Fonts para una tipografía moderna y amigable -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="portrait-lock" aria-live="polite">
        <div class="portrait-lock-card">
            <div class="portrait-lock-icon">📱</div>
            <h2>Gira tu teléfono</h2>
            <p>Esta estación se juega en vertical.</p>
        </div>
    </div>

    <div class="container">
        <button id="btn-back" class="btn-back-map" title="Volver al Mapa">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Volver</span>
        </button>
        <header>
            <h1>Sbeel Dinosaurios</h1>
            <p class="intro">Ordena las piezas para completar la imagen jurásica.</p>
        </header>

        <main>
            <!-- Contenedor del rompecabezas -->
            <div id="puzzle-board" class="puzzle-board">
                <!-- Las piezas se generarán dinámicamente con JavaScript -->
            </div>

            <div class="controls">
                <div id="timer-box" class="timer-box">Tiempo: <span id="countdown">02:00</span></div>
                <button id="reset-btn" class="btn">Mezclar piezas</button>
            </div>
        </main>

        <!-- Mensaje de éxito (oculto por defecto) -->
        <div id="success-modal" class="modal">
            <div class="modal-content">
                <h2>¡Increíble!</h2>
                <p>Has completado el rompecabezas con éxito. ¡Eres un experto paleontólogo!</p>
                <button id="close-modal" class="btn" style="width: 100%; margin-bottom: 1rem;">Volver al mapa</button>
                <button id="retry-modal-btn" class="btn btn-secondary" style="width: 100%; background: transparent; border: 2px solid rgba(255,255,255,0.2); color: white; box-shadow: none; padding: 0.6rem;">Volver a jugar</button>
            </div>
        </div>
    </div>

    <script src="../scripts/orientation-manager.js"></script>
    <script src="../scripts/station-completion.js"></script>
    <script src="script.js"></script>
</body>
</html>
