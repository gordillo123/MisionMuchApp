<!DOCTYPE html>
<html lang="es" data-orientation="portrait">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MUCH &bull; Quiz Interactivo</title>

  <script src="../assets/navigation-guard.js"></script>
  <script src="../assets/role-access.js"></script>
  <script>
    window.MuchRoleAccess?.redirectIfInternalUserOnPlayerPage({ basePath: '../' });
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/btn-back-premium.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../assets/station-completion.css">
  <link rel="stylesheet" href="../assets/quiz-options.css">
</head>

<body>
  <canvas id="confetti" class="confetti-canvas"></canvas>

  <button id="startBtn" class="visually-hidden" hidden></button>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var from = params.get('from');
      var lugar = params.get('lugar');

      // 🛡️ ATRAPAMOS EL LUGAR EN EL MILISEGUNDO 1 ANTES DE QUE SE PIERDA
      if (lugar && lugar.trim() !== '') {
        localStorage.setItem('much_lugar_seguro', lugar.trim());
      } else {
        localStorage.removeItem('much_lugar_seguro');
      }

      // Permite entrar si vienes desde la portada; si no, manda a portada.html
      if (from !== 'portada') {
        // Al redirigir, nos llevamos el enlace completo por si acaso
        location.replace('portada.html' + location.search);
      }
    })();
  </script>

  <main id="quizShell">
    <div class="quiz-card">

      <div class="header-section text-center mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2 px-1">
          <img src="Logo-Ag-14.png" alt="Gobierno de Chiapas" class="logo-header logo-left">
          <img src="logo-sata.png" alt="SATA" class="logo-header logo-right">
        </div>

        <h1 class="app-title mb-0">MUCH &bull; Quiz Interactivo</h1>
        <p class="app-subtitle mb-0">Responde, aprende y demuestra tu conocimiento 🧠</p>
      </div>

      <div class="controls-row d-flex justify-content-between align-items-center gap-3 mb-4">
        <button id="returnBtn" type="button" class="btn-back-premium" title="Regresar al mapa">
          <div class="back-icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span class="back-icon-label">Volver</span>
          </div>
          Regresar
        </button>
        <div id="pillSala" class="sala-pill">Sala: Biodiversidad y Conocimiento</div>

        <input type="checkbox" id="soundToggle" checked hidden>
      </div>

      <div class="progress mb-4" style="height:4px;" role="progressbar">
        <div id="bar" class="progress-bar" style="width:0%"></div>
      </div>

      <section id="quizView">
        <div class="question-container text-center">

          <div class="d-inline-block mb-3">
            <span class="badge-question">
              PREGUNTA <span id="qIndex">1</span> DE <span id="qTotal">10</span>
            </span>
          </div>

          <h2 id="qText" class="question-text mb-4">¿...?</h2>
          <div id="questionTimer" class="question-timer mb-3 fw-bold text-warning">⏳ 15 s</div>
          <p id="qDesc" class="d-none">...</p>
          <div id="options" class="options-list d-flex flex-column gap-3 mb-4">
          </div>

          <div id="status" class="status-msg fw-bold mb-3" aria-live="polite"></div>

          <button id="nextBtn" type="button" class="btn btn-action w-100 py-3 rounded-4 fw-bold shadow-sm">
            Siguiente ➡️
          </button>

        </div>

        <div class="footer-info score-panel text-center mt-4">
          <div class="points-pill">
            ⭐ Puntos: <strong id="points">0</strong>
          </div>
          <div class="score-stat correct-pill">
            <span>Aciertos</span>
            <strong><span id="correctCount">0</span>/<span id="correctTotal">10</span></strong>
          </div>
          <p id="hint" class="tiny text-muted mt-2 mb-0">Consejo: solo puedes elegir una respuesta.</p>
        </div>
      </section>

      <section id="finalView" class="d-none text-center py-4">
        <h2 id="finalTitle" class="h4 fw-bold mb-2">Resultados</h2>
        <div id="finalMsg" class="result-message text-secondary mb-4"></div>

        <div class="result-score mb-4">
          <div class="display-4 fw-bold text-primary mb-0"><span id="finalPoints">0</span></div>
          <small class="text-uppercase tracking-wider">Puntos totales</small>
        </div>

        <p class="mb-4">
          Aciertos: <strong id="finalCorrect">0</strong> de <strong id="finalTotal">0</strong>
        </p>

        <div id="finalAutoNote" class="station-auto-note d-none" aria-live="polite"></div>

        <div id="giftRow" class="d-flex flex-column gap-2 d-none">
          <button id="nextStationBtn" class="btn btn-success w-100 py-3 rounded-4">Volver al mapa y continuar</button>
          <button id="playAgainBtn1" class="btn btn-outline-secondary w-100 py-2 rounded-4">🔁 Jugar otra vez</button>
        </div>

        <div id="retryRow" class="d-flex flex-column gap-2 d-none">
          <button id="playAgainBtn2" class="btn btn-primary w-100 py-3 rounded-4">🔁 Intentar de nuevo</button>
        </div>
      </section>

    </div>
  </main>

  <script src="../scripts/orientation-manager.js"></script>
  <script src="../scripts/much-local-storage.js"></script>
  <script src="../scripts/station-completion.js"></script>
  <script src="../scripts/question-pool.js"></script>
  <script src="preguntas-local.js"></script>
  <script src="app.js"></script>

</body>

</html>
