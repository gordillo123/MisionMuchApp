<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación Entrada MUCH</title>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { color: #22d3ee; margin: 0 0 20px 0; }
    .status { font-size: 22px; font-weight: 900; margin: 20px 0; padding: 15px; border-radius: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .valid { background: #22c55e; color: #fff; box-shadow: 0 0 20px rgba(34, 197, 94, 0.4); }
    .invalid { background: #ef4444; color: #fff; }
    .used { background: #f59e0b; color: #fff; }
    .info { text-align: left; background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
    .info p { margin: 8px 0; color: #cbd5e1; font-size: 14px; }
    .label { color: #64748b; font-size: 11px; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 2px; }
    button { padding: 16px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; font-size: 16px; width: 100%; transition: transform 0.1s; }
    button:active { transform: scale(0.98); }
    .btn-approve { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4); border: 1px solid #4ade80; }
    .loader { font-size: 18px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="card">
    <h1>👮 Acceso MUCH</h1>
    
    <div id="loader" class="loader">Iniciando sistema...</div>

    <div id="resultArea" style="display:none;">
      <div id="statusBox" class="status">...</div>
      <div class="info" id="details"></div>
      <button id="btnCanjear" class="btn-approve" style="display:none;">
        ✅ VALIDAR ENTRADA
      </button>
    </div>
  </div>

  <script>
    const API_BASE_URL = window.location.hostname ? `http://${window.location.hostname}:3000` : 'http://127.0.0.1:3000';

    const loader = document.getElementById('loader');
    const resultArea = document.getElementById('resultArea');
    const statusBox = document.getElementById('statusBox');
    const details = document.getElementById('details');
    const btnCanjear = document.getElementById('btnCanjear');

    function obtenerOperadorLocal() {
      try {
        const rawUser = localStorage.getItem('much_google_user');
        return rawUser ? JSON.parse(rawUser) : null;
      } catch (_) {
        return null;
      }
    }

    function operadorPuedeCanjear(user) {
      const roles = Array.isArray(user?.roles) ? user.roles.map((rol) => String(rol).toLowerCase()) : [];
      return Boolean((user?.id_usuario || user?.id) && (roles.includes('admin') || roles.includes('taquilla')));
    }

    // 1. Obtener ID de la URL (soporta ?folio=... o ?ticket=...)
    const params = new URLSearchParams(window.location.search);
    const folioBoleto = params.get('folio') || params.get('ticket');
    const tokenBoleto = params.get('token') || params.get('qr_token');

    loader.textContent = "Buscando boleto...";

    if (!folioBoleto && !tokenBoleto) {
      loader.innerHTML = "⚠️ <b>Esperando escaneo...</b><br><br><span style='font-size:14px'>Escanea un QR para validar.</span>";
    } else {
      verificarBoleto(tokenBoleto || folioBoleto, Boolean(tokenBoleto));
    }

    async function verificarBoleto(id, porToken = false) {
      try {
        loader.textContent = "Consultando base de datos MySQL local...";

        const endpoint = porToken
          ? `${API_BASE_URL}/api/boletos/qr/${id}`
          : `${API_BASE_URL}/api/boletos/${id}`;
        const res = await fetch(endpoint);
        loader.style.display = 'none';
        resultArea.style.display = 'block';

        if (!res.ok) {
          statusBox.textContent = '❌ NO EXISTE';
          statusBox.className = 'status invalid';
          details.innerHTML = `<p>El folio <b>${id}</b> no se encuentra registrado en MySQL.</p>`;
          return;
        }

        const data = await res.json();

        // Mostrar información
        details.innerHTML = `
          <span class="label">Participante</span>
          <p style="font-size:18px; color:white; font-weight:bold">${data.nombre_usuario || 'Sin nombre'}</p>
          <span class="label">Folio Alfanumérico</span>
          <p style="font-family:monospace; color:#22d3ee; font-size:16px">${data.folio}</p>
          <span class="label">Ubicación / Tipo</span>
          <p style="font-size:14px; color:#bae6fd">${data.ubicacion || data.destino_boleto || data.tipo_entrada || 'Museo Chiapas'}</p>
          <span class="label">Fecha Generación</span>
          <p>${new Date(data.fecha_generacion).toLocaleDateString('es-MX', { hour: '2-digit', minute: '2-digit' })}</p>
          <span class="label">Fecha Límite (Vencimiento)</span>
          <p>${data.valido_hasta ? new Date(data.valido_hasta).toLocaleDateString('es-MX', { hour: '2-digit', minute: '2-digit' }) : 'Sin fecha'}</p>
        `;

        // Lógica de validación (Semáforo)
        if (data.estado === 'canjeado' || data.usado) {
          statusBox.textContent = 'YA USADO';
          statusBox.className = 'status used';
          details.innerHTML += `<p style="color:#f59e0b; font-weight:bold; margin-top:10px; border-top:1px solid #333; padding-top:10px">Este boleto ya fue validado antes.</p>`;
          btnCanjear.style.display = 'none';
          
        } else if (data.estado === 'cancelado') {
          statusBox.textContent = '🚫 CANCELADO';
          statusBox.className = 'status invalid';
          details.innerHTML += `<p style="color:#ef4444; font-weight:bold; margin-top:10px; border-top:1px solid #333; padding-top:10px">Este boleto está cancelado.</p>`;
          btnCanjear.style.display = 'none';
          
        } else if (data.estado === 'vencido') {
          statusBox.textContent = '⛔ CADUCADO';
          statusBox.className = 'status invalid';
          details.innerHTML += `<p style="color:#f87171; font-weight:bold; margin-top:10px;">Su vigencia terminó.</p>`;
          btnCanjear.style.display = 'none';
          
        } else {
          statusBox.textContent = 'DISPONIBLE';
          statusBox.className = 'status valid';
          const operador = obtenerOperadorLocal();
          const puedeCanjear = operadorPuedeCanjear(operador);
          btnCanjear.style.display = puedeCanjear ? 'block' : 'none';

          if (!puedeCanjear) {
            details.innerHTML += `<p style="color:#facc15; font-weight:bold; margin-top:10px; border-top:1px solid #333; padding-top:10px">Inicia sesión como Administrador o Taquilla para validar este boleto.</p>`;
          }

          btnCanjear.onclick = async () => {
            btnCanjear.disabled = true;
            btnCanjear.textContent = 'Validando...';
            try {
              const updateRes = await fetch(`${API_BASE_URL}/api/taquilla/boletos/${data.id_boleto}/canjear`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-user-id': String(operador.id_usuario || operador.id)
                },
                body: JSON.stringify({ observaciones: 'Canje manual vía escaneo QR rápido' })
              });

              if (!updateRes.ok) {
                const errData = await updateRes.json();
                throw new Error(errData.error || 'Error de canje en el backend.');
              }

              statusBox.textContent = '✅ VALIDADO';
              statusBox.className = 'status valid';
              details.innerHTML += `<p style="color:#22c55e; font-weight:bold; margin-top:10px; border-top:1px solid #333; padding-top:10px">¡Entrada canjeada con éxito!</p>`;
              btnCanjear.style.display = 'none';
            } catch (err) {
              statusBox.textContent = '❌ ERROR';
              statusBox.className = 'status invalid';
              details.innerHTML += `<p style="color:#ef4444; font-weight:bold; margin-top:10px;">Error al canjear: ${err.message}</p>`;
              btnCanjear.textContent = 'REINTENTAR';
              btnCanjear.disabled = false;
            }
          };
        }

      } catch (e) {
        loader.textContent = "Error de conexión local";
        loader.style.color = "red";
        console.error(e);
        alert("Ocurrió un error de comunicación local: " + e.message);
      }
    }
  </script>
</body>
</html>
