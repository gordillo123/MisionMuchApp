<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Boleto Ganador · MUCH</title>

  <script src="../assets/role-access.js"></script>
  <script>
    window.MuchRoleAccess?.redirectIfInternalUserOnPlayerPage({ basePath: '../' });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    :root {
      --ink: #0b1220;
      --muted: #64748b;
      --turquesa: #06b6d4;
      --fucsia: #d946ef;
      --paper: #ffffff;
      --paper-line: #e5e7eb;
      --chip-bg: #ecfeff;
      --chip-ink: #075985;
      --whatsapp: #25D366;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: radial-gradient(1200px 800px at 20% 20%, rgba(255, 255, 255, .5), transparent 60%), linear-gradient(135deg, #0ea5b9, #ec4899, #38bdf8, #f472b6);
      background-size: 200% 200%;
      animation: bgmove 24s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    @keyframes bgmove {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .ticket-shell {
      width: 100%;
      max-width: 600px;
      margin-inline: auto;
    }

    .ticket-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(2, 6, 23, .15);
      border: 1px solid rgba(255, 255, 255, .4);
      padding: 10px;
    }

    body.planetarium-ticket {
      color: #e0f2fe;
      background:
        radial-gradient(circle at 18% 18%, rgba(56, 189, 248, .35), transparent 24%),
        radial-gradient(circle at 84% 12%, rgba(250, 204, 21, .22), transparent 16%),
        radial-gradient(circle at 76% 78%, rgba(168, 85, 247, .3), transparent 22%),
        linear-gradient(135deg, #020617, #0f172a 46%, #1e1b4b);
    }

    body.planetarium-ticket::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(125,211,252,.8) 0 1px, transparent 1.4px);
      background-size: 72px 72px, 118px 118px;
      background-position: 0 0, 24px 36px;
      opacity: .55;
    }

    body.planetarium-ticket .ticket-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(15, 23, 42, .96), rgba(30, 27, 75, .96));
      border: 1px solid rgba(125, 211, 252, .45);
      box-shadow: 0 24px 60px rgba(2, 6, 23, .52), 0 0 34px rgba(56, 189, 248, .18);
    }

    body.planetarium-ticket .ticket-card::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -92px;
      top: -72px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 35%, #fef3c7 0 8%, #f59e0b 9% 34%, #7c2d12 35% 100%);
      box-shadow: 0 0 0 14px rgba(56, 189, 248, .11);
      opacity: .9;
    }

    body.planetarium-ticket .ticket-card::after {
      content: "";
      position: absolute;
      width: 290px;
      height: 78px;
      right: -120px;
      top: 28px;
      border: 2px solid rgba(186, 230, 253, .72);
      border-left-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      transform: rotate(-18deg);
      opacity: .7;
    }

    .ticket-paper {
      border: 2px dashed var(--paper-line);
      border-radius: 12px;
      padding: 16px 12px;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    body.planetarium-ticket .ticket-paper {
      background: linear-gradient(180deg, rgba(15, 23, 42, .88), rgba(12, 18, 38, .95));
      border-color: rgba(125, 211, 252, .5);
    }

    body.planetarium-ticket .ticket-title {
      color: #fef08a;
      font-size: clamp(1.32rem, 4vw, 2rem);
      text-shadow: 0 0 18px rgba(250, 204, 21, .22);
    }

    body.planetarium-ticket .label {
      color: #7dd3fc;
    }

    body.planetarium-ticket .value {
      color: #f8fafc;
    }

    body.planetarium-ticket .folio {
      color: #082f49;
      background: #e0f2fe;
      border-color: #7dd3fc;
    }

    body.planetarium-ticket .row {
      border-bottom-color: rgba(125, 211, 252, .22);
    }

    body.planetarium-ticket .logo-box {
      border-color: rgba(125, 211, 252, .35);
      background: rgba(255, 255, 255, .96);
    }

    body.planetarium-ticket #qrcode {
      border-color: #7dd3fc;
      box-shadow: 0 0 0 6px rgba(56, 189, 248, .13);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 30px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #dcfce7;
      color: #166534;
      font-weight: 900;
    }

    .status-pill.used {
      background: #fef3c7;
      color: #92400e;
    }

    .status-pill.expired {
      background: #fee2e2;
      color: #991b1b;
    }

    .message {
      margin: 14px 0 0;
      padding: 12px;
      border-radius: 12px;
      background: rgba(14, 165, 233, .1);
      border: 1px solid rgba(14, 165, 233, .24);
      color: inherit;
      font-weight: 800;
      text-align: center;
    }

    .ticket-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid #f1f5f9;
      padding: 8px 8px 14px;
    }

    .logo-box {
      width: 80px;
      height: 80px;
      min-width: 80px;
      flex-shrink: 0;
      background: #fff;
      border: 1px solid #eef2ff;
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ticket-logo {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .center {
      flex: 1;
      text-align: center;
      min-width: 0;
    }

    .ticket-title {
      font-weight: 800;
      color: var(--fucsia);
      font-size: 1.1rem;
      margin: 0;
      line-height: 1.1;
    }

    .folio {
      display: inline-block;
      background: var(--chip-bg);
      color: var(--chip-ink);
      font-weight: 700;
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #bae6fd;
      margin-top: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .rows {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 0;
      border-bottom: 1px dashed #eef2ff;
    }

    .row-full {
      grid-column: 1 / -1;
    }

    .label {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .value {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
    }

    .qr-section {
      display: flex;
      justify-content: center;
      margin: 20px 0 10px;
    }

    #qrcode {
      padding: 8px;
      background: white;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
    }

    .qr-hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .note {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      text-align: center;
      color: #475569;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-direction: column;
      margin-top: 20px;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 10px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      width: 100%;
      text-align: center;
    }

    .btn-print {
      background: var(--turquesa);
      color: #fff;
    }

    .btn-link {
      background: #fff;
      color: #0f172a;
      border: 2px solid #e2e8f0;
    }

    .btn-download {
      background: linear-gradient(135deg, var(--turquesa), #0891b2);
      color: #fff;
      box-shadow: 0 4px 10px rgba(6, 182, 212, 0.3);
    }

    .btn-whatsapp {
      background: var(--whatsapp);
      color: #fff;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
    }

    @media (min-width: 600px) {
      .actions {
        flex-direction: row;
      }

      .btn {
        width: auto;
        flex: 1;
      }
    }

    @media print {
      .actions {
        display: none;
      }

      .ticket-paper {
        border: 2px solid #000;
      }

      body {
        background: white;
      }
    }
  </style>
</head>

<body>
  <div class="ticket-shell">
    <div class="ticket-card" id="boletoCaptura">
      <div class="ticket-paper">
        <div class="ticket-head">
          <div class="logo-box"><img class="ticket-logo" src="logo-sata.png" alt="SATA" crossorigin="anonymous"
              onerror="this.parentElement.style.display='none'"></div>
          <div class="center">
            <h2 id="tTitle" class="ticket-title">MUCH · Premio</h2>
            <div id="tFolio" class="folio">Cargando...</div>
          </div>
          <div class="logo-box"><img class="ticket-logo" src="logo-much.png" alt="MUCH" crossorigin="anonymous"
              onerror="this.parentElement.style.display='none'"></div>
        </div>

        <div class="rows">
          <div class="row row-full">
            <div class="label">Beneficiario:</div>
            <div id="tNombre" class="value">—</div>
          </div>
          <div class="row">
            <div class="label">Tipo de premio:</div>
            <div id="tPremio" class="value">—</div>
          </div>
          <div class="row">
            <div class="label">Fecha de emisi&oacute;n:</div>
            <div id="tFecha" class="value">—</div>
          </div>
          <div class="row">
            <div class="label">Ubicación:</div>
            <div id="tLugar" class="value">MUCH</div>
          </div>
          <div class="row">
            <div class="label">Teléfono:</div>
            <div id="tTel" class="value">—</div>
          </div>
          <div class="row row-full">
            <div class="label">Correo:</div>
            <div id="tCorreo" class="value" style="word-break: break-all;">—</div>
          </div>
        </div>

        <div class="qr-section">
          <div id="qrcode"></div>
          <div id="tAlfanumerico" style="margin-top: 12px; font-weight: 900; font-size: 1.25rem; letter-spacing: 1px; color: var(--ink);"></div>
        </div>
        <p class="qr-hint">Presenta el Código QR o este Folio Alfanumérico en Taquilla</p>

        <div class="note">⚠️ Válido por una sola entrada. Sujeto a disponibilidad y horarios del museo.</div>
      </div>
    </div>

    <div class="actions">
      <button id="btnDownloadImage" class="btn btn-download">📥 Descargar Boleto (Imagen)</button>
      <a class="btn btn-link" href="../index.html">🏠 Volver al mapa</a>
    </div>
  </div>

  <script>
    (function () {
      const qs = new URLSearchParams(location.search);
      const el = (id) => document.getElementById(id);
      const fmtFull = new Intl.DateTimeFormat('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
      const parseDate = (value, fallback = new Date()) => {
        const date = value ? new Date(value) : fallback;
        return Number.isNaN(date.getTime()) ? fallback : date;
      };

      const rawAccess = qs.get('acceso') || qs.get('premio') || qs.get('titulo') || 'MUCH';
      const isPlanetario = /planetario/i.test(rawAccess) || /planetario/i.test(qs.get('destino') || '');
      const acceso = isPlanetario ? 'Planetario' : rawAccess;
      const titulo = qs.get('titulo') || acceso || 'MUCH · Premio';
      const ubicacion = qs.get('ubicacion') || qs.get('lugar') || (isPlanetario ? 'Planetario Tuxtla' : 'Museo Chiapas');
      const fechaEmision = parseDate(qs.get('valido_desde'));
      const fechaVencimiento = parseDate(qs.get('valido_hasta'), new Date(fechaEmision.getTime() + 7 * 24 * 60 * 60 * 1000));
      const estadoRaw = (qs.get('estado') || 'activo').toLowerCase();
      const estadoVisible = estadoRaw === 'canjeado' || estadoRaw === 'usado'
        ? 'Utilizado'
        : (estadoRaw === 'vencido' ? 'Vencido' : 'Disponible');

      if (isPlanetario) {
        document.body.classList.add('planetarium-ticket');
        const logos = document.querySelectorAll('.ticket-logo');
        if (logos[1]) {
          logos[1].src = '../assets/logo-planetario-tuxtla.svg';
          logos[1].alt = 'Planetario Tuxtla';
        }
      }

      el('tTitle').textContent = titulo;
      const folioBoleto = qs.get('folio') || 'Folio: ...';
      el('tFolio').textContent = folioBoleto;
      const elAlfa = el('tAlfanumerico');
      if (elAlfa) elAlfa.textContent = folioBoleto.replace('Folio:', '').trim();
      el('tNombre').textContent = qs.get('nombre') || '—';
      el('tPremio').textContent = acceso;
      el('tFecha').textContent = fmtFull.format(fechaEmision);
      el('tLugar').innerHTML = ubicacion;
      const rows = document.querySelector('.rows');
      const placeBefore = document.getElementById('tLugar')?.closest('.row');
      if (rows && placeBefore && !document.getElementById('tVencimiento')) {
        const vencimientoRow = document.createElement('div');
        vencimientoRow.className = 'row';
        vencimientoRow.innerHTML = `<div class="label">Fecha de vencimiento:</div><div id="tVencimiento" class="value">${fmtFull.format(fechaVencimiento)}</div>`;
        rows.insertBefore(vencimientoRow, placeBefore);

        const estadoRow = document.createElement('div');
        estadoRow.className = 'row';
        const statusClass = estadoVisible === 'Utilizado' ? 'used' : (estadoVisible === 'Vencido' ? 'expired' : '');
        estadoRow.innerHTML = `<div class="label">Estado:</div><div id="tEstado" class="value"><span class="status-pill ${statusClass}">${estadoVisible}</span></div>`;
        rows.insertBefore(estadoRow, placeBefore);
      }

      const note = document.querySelector('.note');
      if (note) {
        note.textContent = isPlanetario
          ? 'Felicidades, explorador. Este boleto es exclusivo para el Planetario y se valida una sola vez en Taquilla.'
          : 'Felicidades por completar tu misión científica. Válido por una sola entrada.';
      }
      el('tCorreo').textContent = qs.get('correo') || '—';
      el('tTel').textContent = qs.get('telefono') || '—';
    })();
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // 1. GENERAR QR
      const params = new URLSearchParams(window.location.search);
      const container = document.getElementById("qrcode");

      // Buscamos 'folio' (que es lo que manda registro.html) o 'ticket' como respaldo
      const folio = params.get('folio') || params.get('ticket');
      const qrToken = params.get('qr_token') || params.get('token') || '';
      const qrData = params.get('qr_data') || '';

      if ((folio || qrToken || qrData) && container) {
        // Detectamos si es local o producción para crear el link correcto
        const isLocal = window.location.href.includes('localhost') || window.location.href.includes('127.0.0.1');

        // AJUSTA '/Boleto_Digital'
        const baseUrl = isLocal
          ? window.location.origin + '/Boleto_Digital'
          : 'https://gordillo123.github.io/MisionMuchApp/Boleto_Digital';

        // Link final que leerá el guardia
        const validationUrl = qrData || (qrToken
          ? `${baseUrl}/validar.html?token=${encodeURIComponent(qrToken)}`
          : `${baseUrl}/validar.html?folio=${encodeURIComponent(folio)}`);

        console.log("QR apunta a:", validationUrl); // Debug

        container.innerHTML = '';
        new QRCode(container, {
          text: validationUrl,
          width: 128,
          height: 128,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } else {
        container.innerHTML = '<span style="font-size:0.75rem;color:#94a3b8;">Código no disponible</span>';
      }



      // 3. DESCARGAR IMAGEN DIRECTAMENTE
      const btnDownload = document.getElementById('btnDownloadImage');
      if (btnDownload) {
        btnDownload.addEventListener('click', async () => {
          const originalText = btnDownload.textContent;
          btnDownload.textContent = 'Generando descarga... 📥';
          btnDownload.disabled = true;
          try {
            const element = document.getElementById('boletoCaptura');

            // ── Forzar ancho fijo para que la captura salga "cuadradita" ──
            const origWidth = element.style.width;
            const origMaxW = element.style.maxWidth;
            element.style.width = '600px';
            element.style.maxWidth = '600px';

            const canvas = await html2canvas(element, {
              scale: 3,
              backgroundColor: '#ffffff',
              useCORS: true,
              windowWidth: 600
            });

            // ── Restaurar estilos originales ──
            element.style.width = origWidth;
            element.style.maxWidth = origMaxW;

            canvas.toBlob((blob) => {
              const fileName = `Boleto_MUCH_${folio || Date.now()}.png`;
              downloadImage(blob, fileName);
              btnDownload.textContent = '¡Descargado! 📥';
              setTimeout(() => { btnDownload.textContent = originalText; btnDownload.disabled = false; }, 2000);
            }, 'image/png');
          } catch (err) {
            console.error(err); alert("Error al descargar imagen.");
            btnDownload.textContent = originalText; btnDownload.disabled = false;
          }
        });
      }

      function downloadImage(blob, fileName) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName || 'Boleto_MUCH.png'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      }
    });
  </script>
</body>

</html>
