<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#7d2184">
<title>MUCH · Portada</title>
<script src="../assets/navigation-guard.js"></script>
<script src="../assets/role-access.js"></script>
<script>
  window.MuchRoleAccess?.redirectIfInternalUserOnPlayerPage({ basePath: '../' });
</script>
<style>
  :root{
    --bg1:#323bef; --bg2:#b994fe; --white:#fff;
    --card-br:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100svh;
    display:grid; place-items:center;
    background: radial-gradient(1200px 600px at 10% 0%, var(--bg1), transparent),
                linear-gradient(180deg, var(--bg1), var(--bg2));
    padding:max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(16px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card{
    width:min(920px, 94vw);
    max-height:calc(100svh - max(28px, env(safe-area-inset-top)) - max(18px, env(safe-area-inset-bottom)));
    border-radius:var(--card-br);
    background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.06));
    border:1px solid rgba(255,255,255,.45);
    box-shadow:0 30px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.2);
    padding:clamp(16px, 5vw, 32px);
    text-align:center; color:var(--white);
    backdrop-filter: blur(6px);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow:visible;
  }

  /* ===== LOGOS (base) ===== */
 .logo-esquina{
  position:absolute;
  /* tamaño base (si no se sobreescribe) */
  --logo-h: clamp(56px, 12vw, 84px);
  /* cuánto se levantan respecto a su propio alto */
  --raise: 1.25;                 /* <- súbelo si quieres mayor separación global */
  height: var(--logo-h);
  width:auto;
  top: calc(-1 * var(--raise) * var(--logo-h));  /* sube proporcional */
  border-radius:12px;
  background:#fff;
  padding:8px 12px;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
}

/* IZQUIERDO: tamaño fijo 43px y un poco más arriba */
.logo-izq-abs{
  left:20px;
  --logo-h: 45px;    /* tamaño que pediste */
  --raise: 1.40;     /* súbelo sin tocar el derecho */
}

/* DERECHO: tamaño fijo 44px y mismo margen superior */
.logo-der-abs{
  right:20px;
  --logo-h: 45px;    /* tamaño que pediste */
  --raise: 1.40;     /* igual separación que el izquierdo */
  background:#f6f6f6;
}

  
  /* Logo MUCH */
  .logo-much{
    display:block; margin:0 auto clamp(16px, 4vw, 24px);
    height:clamp(68px, 15svh, 100px); width:auto; filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
  }

  h1{ font-size: clamp(25px, 7vw, 50px); line-height:1.05; font-weight:900; letter-spacing:.6px;
      text-shadow:0 2px 8px rgba(0,0,0,.35); margin: 6px 0 10px; overflow-wrap:anywhere; }
  .sub{ font-size:clamp(14px, 3.8vw, 20px); opacity:.95; margin-bottom:clamp(12px, 4vw, 18px); line-height:1.22; overflow-wrap:anywhere; text-wrap:balance; }

  .btn{
    appearance:none; border:0; cursor:pointer; display:inline-block; text-decoration:none;
    padding:clamp(12px, 3.8vw, 16px) clamp(18px, 6vw, 22px);
    border-radius:16px; font-weight:900; font-size:clamp(16px, 4vw, 20px); color:#fff;
    background:linear-gradient(135deg,#f72585,#7209b7);
    box-shadow:0 18px 44px rgba(155,92,249,.35),0 6px 16px rgba(0,0,0,.25);
    min-width:200px; min-height:48px;
  }
  .tip{margin-top:clamp(10px, 3vw, 14px); font-size:clamp(12px, 3.4vw, 14px); opacity:.9; line-height:1.25; overflow-wrap:anywhere; text-wrap:balance;}

  /* Botón Regresar al Mapa (Píldora Premium) */
  .btn-regresar-mapa {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    height: 46px;
    padding: 0 22px;
    border-radius: 23px;
    background: linear-gradient(135deg, #e65c00, #f5af19);
    border: 2px solid rgba(255, 255, 255, 0.85);
    color: white;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow:
      0 8px 22px rgba(230, 92, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 1000;
    text-decoration: none;
    white-space: nowrap;
  }

  .btn-regresar-mapa svg {
    transition: transform 0.3s ease;
  }

  .btn-regresar-mapa:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow:
      0 12px 28px rgba(230, 92, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.3);
    background: linear-gradient(135deg, #f5af19, #e65c00);
  }

  .btn-regresar-mapa:hover svg {
    transform: translateX(-3px);
  }

  .btn-regresar-mapa:active {
    transform: translateY(1px) scale(0.96);
    box-shadow: 0 4px 10px rgba(230, 92, 0, 0.2);
  }

  /* Prevención de colisión en móviles */
  @media (max-width: 600px) {
    .btn-regresar-mapa {
      position: relative;
      top: auto;
      left: auto;
      margin: 15px auto 0;
      display: inline-flex;
      height: 42px;
      padding: 0 18px;
      font-size: 0.88rem;
      border-radius: 21px;
    }
  }

  @media (max-width: 480px) {
    body {
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }

    .card {
      width:min(94vw, 430px);
      padding:clamp(14px, 4.5vw, 22px);
      border-radius:20px;
    }

    .logo-esquina {
      --logo-h: clamp(34px, 10vw, 42px);
      padding:5px 8px;
      border-radius:10px;
    }

    .logo-izq-abs { left:clamp(10px, 4vw, 16px); }
    .logo-der-abs { right:clamp(10px, 4vw, 16px); }
    .logo-much { margin-bottom:clamp(8px, 2.2svh, 14px); }
    h1 { font-size:clamp(24px, 8vw, 36px); margin-bottom:clamp(6px, 1.4svh, 10px); }
    .sub { margin-bottom:clamp(10px, 2.4svh, 14px); }
    .btn { min-width:min(200px, 82vw); min-height:44px; }
  }

  @media (max-height: 640px) {
    body { padding-top:max(48px, env(safe-area-inset-top)); }
    .card { padding-block:clamp(12px, 3svh, 20px); }
    .logo-much { height:clamp(52px, 13svh, 78px); margin-bottom:clamp(6px, 1.6svh, 10px); }
    h1 { font-size:clamp(22px, 7svh, 34px); margin:2px 0 6px; }
    .sub { font-size:clamp(12px, 3.1svh, 16px); margin-bottom:clamp(8px, 1.8svh, 12px); }
    .btn { padding-block:clamp(9px, 2.2svh, 12px); min-height:42px; font-size:clamp(14px, 3.3svh, 17px); }
    .tip { margin-top:clamp(6px, 1.5svh, 10px); font-size:clamp(11px, 2.8svh, 13px); }
  }
</style>
</head>
<body>
  <a href="#" class="btn-regresar-mapa" id="btnReturnToMap" title="Volver al Mapa">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span>Regresar</span>
  </a>

  <main class="card">
    <img src="Logo-Ag-14.png" alt="Logo Aditech" class="logo-esquina logo-izq-abs">
    <img src="logo-sata.png" alt="Logo SATA" class="logo-esquina logo-der-abs">

    <img src="logo-much.png" alt="Logo MUCH" class="logo-much">

    <h1>MUCH</h1>
    <p class="sub">¡Aprende y gana premios! 🎁</p>

    <a class="btn" id="btnJugar" href="index.html?from=portada">🚀 Jugar ahora</a>
    <p class="tip">Consejo: lee cuidadosamente las preguntas. 🦖</p>
  </main>

  <script>
    // 🛡️ GUARDAR EL LUGAR DESDE LA PORTADA TAMBIÉN (POR SI ENTRAN DIRECTO AQUÍ)
    const params = new URLSearchParams(window.location.search);
    const lugar = params.get('lugar');
    if (lugar && lugar.trim() !== "") {
      localStorage.setItem('much_lugar_seguro', lugar);
    }

    // PASAR LOS PARÁMETROS AL BOTÓN DE JUGAR
    const btnJugar = document.getElementById('btnJugar');
    params.set('from', 'portada');
    btnJugar.href = 'index.html?' + params.toString();

    // Lógica para el botón de regresar al mapa principal
    document.getElementById('btnReturnToMap').addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = '../index.html?view=prep';
    });
  </script>
</body>
</html>
